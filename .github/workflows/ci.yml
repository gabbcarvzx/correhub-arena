name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feature/**', 'fix/**']

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_SECRET: ci-local-oauth-placeholder
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: docker info
      - name: Start local Supabase without printing ephemeral keys
        run: npm run db:start >/dev/null
      - name: Run npm run db:reset
        shell: bash
        run: |
          set +e
          npm run db:reset > "$RUNNER_TEMP/database-reset.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/database-reset.log"
          if [ "$status" -ne 0 ]; then
            summary="$(tail -c 7000 "$RUNNER_TEMP/database-reset.log" | tr '\n' ' ' | sed 's/%/%25/g' | cut -c1-7000)"
            echo "::error title=Database reset failed::$summary"
            {
              echo '### Database reset failure details (last 80 lines)'
              echo '```text'
              tail -n 80 "$RUNNER_TEMP/database-reset.log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
      # Keep pgTAP failure details visible in annotations and the job summary.
      - name: Run npm run db:test
        shell: bash
        run: |
          set +e
          npm run db:test > "$RUNNER_TEMP/database-test.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/database-test.log"
          if [ "$status" -ne 0 ]; then
            summary="$(tail -c 7000 "$RUNNER_TEMP/database-test.log" | tr '\n' ' ' | sed 's/%/%25/g' | cut -c1-7000)"
            echo "::error title=Database tests failed::$summary"
            {
              echo '### Database test failure details (last 80 lines)'
              echo '```text'
              tail -n 80 "$RUNNER_TEMP/database-test.log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
      - name: Run npm run db:lint
        shell: bash
        run: |
          set +e
          npm run db:lint > "$RUNNER_TEMP/database-lint.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/database-lint.log"
          if [ "$status" -ne 0 ]; then
            summary="$(tail -c 7000 "$RUNNER_TEMP/database-lint.log" | tr '\n' ' ' | sed 's/%/%25/g' | cut -c1-7000)"
            echo "::error title=Database lint failed::$summary"
            {
              echo '### Database lint failure details (last 80 lines)'
              echo '```text'
              tail -n 80 "$RUNNER_TEMP/database-lint.log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
      - run: npm run db:types
      - run: git diff --exit-code -- src/types/database.ts
      - run: npm run test:e2e:install
      - run: npm run test:auth
      - if: always()
        run: npm run db:stop
